app = "projectmandiri-vectorizer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  STORAGE_DIR = "/tmp/vectorizer-storage"
  MAX_UPLOAD_MB = "10"
  UPLOAD_RATE_LIMIT_PER_MINUTE = "3"
  PREPROCESS_MAX_DIMENSION = "2048"
  TRACE_THRESHOLD = "180"
  TRACE_TURD_SIZE = "4"
  TRACE_OPT_TOLERANCE = "0.18"
  SUPABASE_URL = "https://aemnvrxpptessfxaefqe.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = ""
  GLM_API_BASE_URL = "https://api.z.ai/api/paas/v4"
  GLM_ANALYSIS_MODEL = "glm-5v-turbo"
  GLM_IMAGE_MODEL = "glm-image"
  AI_REDRAW_PRESET = "quality"
  GEMINI_ANALYSIS_MODEL = "gemini-3-pro-preview"
  IMAGEN_GENERATION_MODEL = "imagen-3.0-generate-002"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
