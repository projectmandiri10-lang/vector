app = "projectmandiri-vectorizer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  STORAGE_DIR = "/tmp/vectorizer-storage"
  MAX_UPLOAD_MB = "10"
  UPLOAD_RATE_LIMIT_PER_MINUTE = "3"
  PREPROCESS_MAX_DIMENSION = "2048"
  TRACE_THRESHOLD = "180"
  TRACE_TURD_SIZE = "4"
  TRACE_OPT_TOLERANCE = "0.18"
  SUPABASE_URL = "https://aemnvrxpptessfxaefqe.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = ""
  OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
  OPENROUTER_ANALYSIS_MODEL = "qwen/qwen3-vl-235b-a22b-instruct"
  OPENROUTER_IMAGE_MODEL = "qwen/qwen-image-2512"
  OPENROUTER_IMAGE_QUALITY = "high"
  OPENROUTER_APP_NAME = "Design Mudah Vector"
  AI_REDRAW_PRESET = "quality"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
