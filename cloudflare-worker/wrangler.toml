name = "design-mudah"
main = "src/index.js"
compatibility_date = "2026-05-26"

[vars]
GLM_API_BASE_URL = "https://api.z.ai/api/paas/v4"
GLM_ANALYSIS_MODEL = "glm-5v-turbo"
GLM_IMAGE_MODEL = "glm-image"
AI_REDRAW_PRESET = "quality"
GEMINI_ANALYSIS_MODEL = "gemini-3-pro-preview"
IMAGEN_GENERATION_MODEL = "imagen-3.0-generate-002"
SUPABASE_URL = "https://aemnvrxpptessfxaefqe.supabase.co"
# Isi setelah backend processor berhasil deploy ke Cloud Run.
# PROCESSOR_BASE_URL = "https://design-mudah-processor-xxxxx.a.run.app"

[secrets]
required = ["SUPABASE_SERVICE_ROLE_KEY"]
# Optional untuk proxy processor Cloud Run:
# PROCESSOR_API_KEY

# Set required secrets before deploy:
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY
