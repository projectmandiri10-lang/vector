substitutions:
  _REGION: asia-southeast2
  _ARTIFACT_REPOSITORY: design-mudah
  _SERVICE: design-mudah-processor
  _FRONTEND_ORIGIN: https://designmudah.pages.dev

steps:
  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - ./backend

  - id: push-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE}:$SHORT_SHA

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --execution-environment
      - gen2
      - --cpu
      - "1"
      - --memory
      - 2Gi
      - --timeout
      - "600"
      - --concurrency
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "1"
      - --set-env-vars
      - NODE_ENV=production,STORAGE_DIR=/tmp/vectorizer-storage,MAX_UPLOAD_MB=10,UPLOAD_RATE_LIMIT_PER_MINUTE=3,PREPROCESS_MAX_DIMENSION=2048,TRACE_THRESHOLD=180,TRACE_TURD_SIZE=4,TRACE_OPT_TOLERANCE=0.18,CORS_ORIGIN=${_FRONTEND_ORIGIN},OPENROUTER_BASE_URL=https://openrouter.ai/api/v1,OPENROUTER_ANALYSIS_MODEL=,OPENROUTER_IMAGE_MODEL=sourceful/riverflow-v2.5-pro:free,OPENROUTER_SAFETY_MODEL=nvidia/nemotron-3.5-content-safety:free,OPENROUTER_IMAGE_QUALITY=high,OPENROUTER_IMAGE_SIZE=2K,OPENROUTER_REASONING_EFFORT=medium,OPENROUTER_BACKGROUND_MODE=transparent,OPENROUTER_SAFETY_ENABLED=1,OPENROUTER_APP_NAME=Design Mudah Vector,AI_REDRAW_PRESET=quality
      - --set-secrets
      - PROCESSOR_API_KEY=processor-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE}:$SHORT_SHA
